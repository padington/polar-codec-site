<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3"><rect width="1400" height="440" fill="#0b1016"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa7b4"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4cc2ff"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a623"/></marker></defs><rect x="40.0" y="70" width="224" height="170" rx="14" fill="#151d27" stroke="#2a3541" stroke-width="3" /><text x="152.0" y="130.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >square file</text><text x="152.0" y="163.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >(circle + white</text><text x="152.0" y="196.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >corners)</text><line x1="270.0" y1="155.0" x2="308.0" y2="155.0" stroke="#9aa7b4" stroke-width="4" marker-end="url(#ah)"/><rect x="314.0" y="70" width="224" height="170" rx="14" fill="#151d27" stroke="#f5a623" stroke-width="3" /><text x="426.0" y="146.83333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >unroll</text><text x="426.0" y="179.83333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >into the strip</text><line x1="544.0" y1="155.0" x2="582.0" y2="155.0" stroke="#9aa7b4" stroke-width="4" marker-end="url(#ah)"/><rect x="588.0" y="70" width="224" height="170" rx="14" fill="#151d27" stroke="#4cc2ff" stroke-width="3" /><text x="700.0" y="130.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >standard codec</text><text x="700.0" y="163.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >x264 today,</text><text x="700.0" y="196.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >AV1 next</text><line x1="818.0" y1="155.0" x2="856.0" y2="155.0" stroke="#9aa7b4" stroke-width="4" marker-end="url(#ah)"/><rect x="862.0" y="70" width="224" height="170" rx="14" fill="#151d27" stroke="#f5a623" stroke-width="3" /><text x="974.0" y="146.83333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >roll back</text><text x="974.0" y="179.83333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >to the square</text><line x1="1092.0" y1="155.0" x2="1130.0" y2="155.0" stroke="#9aa7b4" stroke-width="4" marker-end="url(#ah)"/><rect x="1136.0" y="70" width="224" height="170" rx="14" fill="#151d27" stroke="#2a3541" stroke-width="3" /><text x="1248.0" y="130.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >same square</text><text x="1248.0" y="163.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >file the app</text><text x="1248.0" y="196.33333333333334" font-size="25" text-anchor="middle" fill="#e6edf3" font-weight="normal" >plays</text><text x="700.0" y="288" font-size="30" text-anchor="middle" fill="#4cc2ff" font-weight="bold" >nothing inside the codec was changed</text><text x="700.0" y="340" font-size="28" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >Time per frame (Python prototype): unroll 22 ms + roll back 11 ms,</text><text x="700.0" y="378" font-size="28" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >against 5.4 ms for the x264 encode itself. The wrapper costs more time than the codec.</text></svg>