<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3"><rect width="1000" height="640" fill="#0b1016"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa7b4"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4cc2ff"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f5a623"/></marker></defs><rect x="70" y="150" width="200" height="200" fill="#4cc2ff" fill-opacity="0.25" stroke="#4cc2ff" stroke-width="4"/><line x1="120.0" y1="150" x2="120.0" y2="350" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><line x1="70" y1="200.0" x2="270" y2="200.0" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><line x1="170.0" y1="150" x2="170.0" y2="350" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><line x1="70" y1="250.0" x2="270" y2="250.0" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><line x1="220.0" y1="150" x2="220.0" y2="350" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><line x1="70" y1="300.0" x2="270" y2="300.0" stroke="#4cc2ff" stroke-width="1.5" stroke-opacity="0.6"/><text x="170.0" y="400" font-size="26" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >a block in</text><text x="170.0" y="432" font-size="26" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >the last frame</text><line x1="300" y1="250.0" x2="440" y2="250.0" stroke="#9aa7b4" stroke-width="4" marker-end="url(#ah)"/><text x="370" y="224.0" font-size="28" text-anchor="middle" fill="#e6edf3" font-weight="bold" >6 numbers</text><polygon points="505.3,96.9 710.7,163.7 674.7,379.1 469.3,312.3" fill="#f5a623" fill-opacity="0.25" stroke="#f5a623" stroke-width="4"/><text x="590" y="426" font-size="26" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >where it is now: shifted,</text><text x="590" y="458" font-size="26" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >turned, zoomed, sheared</text><text x="760" y="120" font-size="28" text-anchor="start" fill="#e6edf3" font-weight="normal" >shift x, shift y</text><text x="760" y="162" font-size="28" text-anchor="start" fill="#e6edf3" font-weight="normal" >rotation</text><text x="760" y="204" font-size="28" text-anchor="start" fill="#e6edf3" font-weight="normal" >zoom</text><text x="760" y="246" font-size="28" text-anchor="start" fill="#e6edf3" font-weight="normal" >two shear terms</text><text x="760" y="310" font-size="24" text-anchor="start" fill="#9aa7b4" font-weight="normal" >AV1: global motion</text><text x="760" y="340" font-size="24" text-anchor="start" fill="#9aa7b4" font-weight="normal" >+ warped motion</text><text x="760" y="370" font-size="24" text-anchor="start" fill="#9aa7b4" font-weight="normal" >VVC: affine, 4 or 6</text><text x="500.0" y="572" font-size="28" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >The codec already describes turning and zooming</text><text x="500.0" y="608" font-size="28" text-anchor="middle" fill="#9aa7b4" font-weight="normal" >on the square grid. No new pixel layout needed.</text></svg>